---
- name: Deploy Pop-Quizz
  hosts: server
  become: true

  # Pre-tasks to ensure that the deployment is safe and that the required variables are defined.
  pre_tasks:
    - name: Refuse to deploy without explicit immutable tags
      ansible.builtin.assert:
        that:
          - frontend_image_tag is defined
          - backend_image_tag is defined
          - frontend_image_tag != 'latest'
          - backend_image_tag != 'latest'
        fail_msg: >-
          Provide frontend_image_tag and backend_image_tag
          (a commit SHA, never 'latest').

  tasks:
    - name: Create application directory
      file:
        path: /opt/pop-quizz
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Create environment file from template
      template:
        src: ../templates/mini-n8n.env.j2
        dest: /opt/pop-quizz/.env
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: Copy docker-compose.yml to server
      copy:
        src: ../../docker/docker-compose.yml
        dest: /opt/pop-quizz/docker-compose.yml
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Create database directory
      file:
        path: /opt/pop-quizz/database
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Copy database initialization script
      copy:
        src: ../../docker/database/skeleton.sql
        dest: /opt/pop-quizz/database/skeleton.sql
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Pull Docker images
      command:
        cmd: docker compose pull
        chdir: /opt/pop-quizz

    - name: Start Pop Quiz services
      command:
        cmd: docker compose up -d
        chdir: /opt/pop-quizz
